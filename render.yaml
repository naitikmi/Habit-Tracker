services:
  - type: web
    name: habit-tracker
    runtime: node
    repo: https://github.com/naitikmi/Habit-Tracker
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: habit-tracker-db
          property: connectionString

databases:
  - name: habit-tracker-db
    plan: free
